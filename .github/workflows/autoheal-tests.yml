name: EKA Tests - AutoHeal Gate

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Enterprise Knowledge Assistant Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run contract and security tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q \
            tests/test_rag.py \
            tests/test_mcp.py \
            tests/test_agents.py \
            tests/test_security.py \
            tests/test_evaluation.py

      - name: Validate evaluation dataset
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python evaluation/run_evaluation.py

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eka-evaluation-artifacts
          path: |
            evaluation/evaluation_report.json
          if-no-files-found: ignore

  # This job is intentionally separate so AutoHeal can distinguish
  # application tests from evaluation/security gates.
  ai-quality-gate:
    name: AI Quality Gate
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check evaluation assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          dataset = json.loads(
              Path("evaluation/dataset.json").read_text()
          )

          assert len(dataset) >= 10

          required = {
              "id",
              "category",
              "question",
              "expected_behavior",
          }

          assert all(required <= set(x) for x in dataset)

          print(
              f"Evaluation dataset OK: {len(dataset)} cases"
          )
          PY

      - name: Report CI state
        run: |
          echo "AutoHeal input:"
          echo "  workflow: $GITHUB_WORKFLOW"
          echo "  run_id: $GITHUB_RUN_ID"
          echo "  sha: $GITHUB_SHA"
          echo "  repository: $GITHUB_REPOSITORY"
          echo "  conclusion is determined by GitHub Actions."